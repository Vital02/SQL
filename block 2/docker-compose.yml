version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: course_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 4444
      POSTGRES_DB: database
    ports:
      - "4444:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  pg_data: